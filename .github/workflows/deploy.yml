name: Deploy Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@127.0.0.1:5432/testing
      JWT_SECRET_KEY: test_secret_key_1234567890
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Migrations
        run: |
          python -m alembic upgrade head

      - name: Run Tests
        run: |
          pytest

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ secrets.GOOGLE_CLOUD_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.GOOGLE_CLOUD_REGION }}-docker.pkg.dev/${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}/${{ secrets.GOOGLE_CLOUD_ARTIFACT_REPO }}/tbconsult-backend:${{ github.sha }}
            ${{ secrets.GOOGLE_CLOUD_REGION }}-docker.pkg.dev/${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}/${{ secrets.GOOGLE_CLOUD_ARTIFACT_REPO }}/tbconsult-backend:latest
          cache-from: type=registry,ref=${{ secrets.GOOGLE_CLOUD_REGION }}-docker.pkg.dev/${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}/${{ secrets.GOOGLE_CLOUD_ARTIFACT_REPO }}/tbconsult-backend:latest
          cache-to: type=inline

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tbconsult-backend
          region: ${{ secrets.GOOGLE_CLOUD_REGION }}
          image: ${{ secrets.GOOGLE_CLOUD_REGION }}-docker.pkg.dev/${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}/${{ secrets.GOOGLE_CLOUD_ARTIFACT_REPO }}/tbconsult-backend:${{ github.sha }}
          env_vars: |
            ENVIRONMENT=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ALGORITHM=HS256
            JWT_EXPIRATION_MINUTES=60
            DIGITALOCEAN_API_KEY=${{ secrets.DIGITALOCEAN_API_KEY }}
            DIGITALOCEAN_BASE_URL=${{ secrets.DIGITALOCEAN_BASE_URL }}
            LLM_MODEL_ID=${{ secrets.LLM_MODEL_ID }}
            EMBED_MODEL_ID=${{ secrets.EMBED_MODEL_ID }}
            RERANKER_MODEL_ID=${{ secrets.RERANKER_MODEL_ID }}
            RATE_LIMIT_PER_MINUTE=10
            DIGITALOCEAN_TIMEOUT_MS=60000
            WEB_SEARCH_TIMEOUT_MS=1500
            PGVECTOR_TIMEOUT_MS=2000
            MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
            GOOGLE_CLOUD_STORAGE_BUCKET=${{ secrets.GOOGLE_CLOUD_STORAGE_BUCKET }}
            GOOGLE_CLOUD_CREDENTIALS='${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}'
